name: РЕВО ОБХОД
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  obhod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pinned 2026-11-15, W8)
      - name: дежурная проверка оформления
        run: python3 revo_obhod.py --issue || true
